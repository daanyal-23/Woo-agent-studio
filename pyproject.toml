[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woo-agent-connector"
version = "0.1.0"
description = "Production-grade private WooCommerce connector foundation for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=2.3.0,<3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.scripts]
woo-connector-mcp = "woo_connector.mcp_server:main"


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]
demo = [
    "groq>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/woo_connector"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: live integration tests against WooCommerce instance"
]
